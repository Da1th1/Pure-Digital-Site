events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # No backend proxy: static frontend only

        # Static files caching
        # Hashed build assets: cache forever
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Un-hashed public files (icons, og-image, poster): cache for a day
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp4|woff2)$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # Never cache the HTML shell so deploys show up immediately
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Basic security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
